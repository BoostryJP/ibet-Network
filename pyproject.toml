[project]
name = "ibet-network-tools"
version = "2.8"
description = "Development tooling for ibet-Network"
authors = [{ name = "BOOSTRY Co., Ltd.", email = "dev@boostry.co.jp" }]
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
dev = [
    "black>=26.3.1,<27",
    "isort>=8.0.1,<9",
    "pyright>=1.1.408,<2",
    "web3==8.0.0",
]

[tool.uv]
exclude-newer = "7 days"
# GHSA-6q48-6c7w-9gw2: require the fixed CA bundle without the release-age delay.
constraint-dependencies = ["certifi>=2026.10.19"]
exclude-newer-package = { certifi = "0 days" }

[tool.isort]
profile = "black"
combine_as_imports = true
