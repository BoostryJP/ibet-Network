name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  format_and_typecheck:
    runs-on: ubuntu-latest
    env:
      UV_MALWARE_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.5.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install dependencies with malware checks
        run: make install

      - name: Run format check
        run: make format-check

      - name: Run type check
        run: make typecheck
