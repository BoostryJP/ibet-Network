name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  format_and_typecheck:
    runs-on: ubuntu-latest
    env:
      UV_MALWARE_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.5.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies with malware checks
        run: make install

      - name: Run format check
        run: make format-check

      - name: Run type check
        run: make typecheck
