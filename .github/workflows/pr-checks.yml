name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  format_and_typecheck:
    runs-on: ubuntu-latest
    env:
      UV_MALWARE_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies with malware checks
        run: make install

      - name: Run format check
        run: make format-check

      - name: Run type check
        run: make typecheck
