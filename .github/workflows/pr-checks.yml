name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  format_and_typecheck:
    runs-on: ubuntu-latest
    env:
      UV_MALWARE_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.5.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies with malware checks
        run: make install

      - name: Run format check
        run: make format-check

      - name: Run type check
        run: make typecheck
