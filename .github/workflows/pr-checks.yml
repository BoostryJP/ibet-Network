name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  format_and_typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.5.0
        with:
          python-version: "3.13.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: make install-tools

      - name: Run format check
        run: make format-check

      - name: Run type check
        run: make typecheck
